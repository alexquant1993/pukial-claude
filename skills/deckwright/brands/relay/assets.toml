# Every non-text file in this brand, with its hash and where it came from.
# `scripts/lint_deck.py --rules <deck>/lint.toml` fails on any file here that
# is missing or whose hash moved, and on any file in the package that is not
# listed. Regenerate the blocks with:
#   python scripts/lint_deck.py manifest --brand relay
# and fill the provenance in by hand - the generator never invents one.
#
# The six faces are ALSO declared in `fonts.toml`, which is a different
# question: this file says where a committed binary came from, that one says
# what to fetch and against which hash. `scripts/fetch_fonts.py` writes the
# file; a human writes the block below. The two hashes must agree, and the
# lint fails here if the file on disk stops matching.
#
# Relay's own readme flags three substitutions (fonts, logo, icons). Two of
# them are still substitutions here; the fonts are not, because all three of
# Relay's named families are OFL and are now fetched.

