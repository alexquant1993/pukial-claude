[project]
name = "deckwright"
version = "0.1.0"
description = "A portable idea -> HTML -> PPTX deck pipeline"
requires-python = ">=3.11"
dependencies = ["python-pptx>=1.0", "pillow>=10.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deck_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
